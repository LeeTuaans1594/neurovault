# ═══════════════════════════════════════════════════════════
# NEUROVAULT — Docker Compose Production Configuration
# Services: MongoDB, API Gateway, AI Core, Frontend (Nginx)
# Usage:
#   docker compose up -d            # Start all services
#   docker compose logs -f api      # View API logs
#   docker compose down             # Stop all
#   docker compose up -d --build    # Rebuild + restart
# ═══════════════════════════════════════════════════════════

services:
  # ═══ MongoDB 7 — Persistent Data Layer ═══
  mongodb:
    image: mongo:7
    container_name: neurovault-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: neurovault
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - neurovault-net

  # ═══ Node.js Express API Gateway ═══
  api-gateway:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: neurovault-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/neurovault
      JWT_SECRET: ${JWT_SECRET:-neurovault-prod-secret-CHANGE-ME}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-neurovault-refresh-CHANGE-ME}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      AI_CORE_URL: http://ai-core:8000
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
    volumes:
      - upload_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - neurovault-net

  # ═══ Python FastAPI AI Core ═══
  ai-core:
    build:
      context: ./backend/ai_core
      dockerfile: Dockerfile
    container_name: neurovault-ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      MONGODB_URI: mongodb://mongodb:27017/neurovault
    volumes:
      - ai_data:/app/data
      - upload_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - neurovault-net

  # ═══ React Frontend (Nginx) ═══
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurovault-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - neurovault-net

# ═══ Named Volumes ═══
volumes:
  mongo_data:
    name: neurovault-mongo-data
  mongo_config:
    name: neurovault-mongo-config
  upload_data:
    name: neurovault-uploads
  ai_data:
    name: neurovault-ai-data

# ═══ Network ═══
networks:
  neurovault-net:
    name: neurovault-network
    driver: bridge
