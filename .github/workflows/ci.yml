name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**", "test/**", "docs/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  ai-core:
    name: AI core (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ai_core/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q -m "not integration"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
